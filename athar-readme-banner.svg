      <stop offset="1" stop-color="#69c5a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="170" rx="450" ry="240" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="304" rx="18" fill="none" stroke="url(#gold)" stroke-opacity=".52" stroke-width="1.5"/>
