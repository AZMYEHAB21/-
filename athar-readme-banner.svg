    <path d="M112 39 L112 125 M69 82 L155 82 M82 52 L142 112 M142 52 L82 112" stroke-opacity=".58"/>
    <path d="M1088 215 l16 16 -16 16 -16 -16z M1088 183 l48 48 -48 48 -48 -48z" stroke-opacity=".5"/>
    <path d="M1088 170 v-16 M1088 279 v-16 M1027 231 h-16 M1150 231 h-16" stroke-opacity=".55"/>
