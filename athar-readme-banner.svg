<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">أثر | Athar</title>
  <desc id="desc">A calm emerald and gold banner for Athar, a website for the Holy Quran, remembrance and prayer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f2b"/>
      <stop offset="0.55" stop-color="#0b5148"/>
      <stop offset="1" stop-color="#073b36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba75b"/>
      <stop offset="0.5" stop-color="#f5dfa0"/>
      <stop offset="1" stop-color="#b99145"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 27 0 L 27 54 M 0 27 L 54 27" fill="none" stroke="#d9c58b" stroke-opacity=".09" stroke-width="1"/>
      <path d="M 0 0 L 54 54 M 54 0 L 0 54" fill="none" stroke="#d9c58b" stroke-opacity=".045" stroke-width="1"/>
